[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-eyes-cdo-nco-workshop"
version = "1.0.0"
description = "A seminar-ready CDO/NCO reproduction of the Fresh Eyes CMIP6 Python workshop"
requires-python = ">=3.11"
dependencies = [
  "cftime>=1.6",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "netCDF4>=1.7",
  "numpy>=2.0",
  "pandas>=2.2",
  "pytest>=8.3",
  "xarray>=2024.7",
]

[tool.setuptools]
py-modules = ["workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

