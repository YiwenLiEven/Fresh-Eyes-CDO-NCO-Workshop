name: Verify climate workshop
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-equivalence:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: binder/environment.yml
          cache-environment: true
      - name: Install Python package
        shell: bash -el {0}
        run: python -m pip install -e .
      - name: Execute scientific workflows and seminar notebooks
        shell: bash -el {0}
        run: bash binder/postBuild
      - name: Save figures, comparisons and executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seminar-verification
          path: |
            outputs/verification.json
            outputs/demo/monthly/*validation.json
            outputs/demo/monthly/*.png
            outputs/executed/*.ipynb
            outputs/updated_build/*validation.json
            outputs/updated_build/*.png
            outputs/updated_real_build/*validation.json
            outputs/updated_real_build/*.png
            data/access_cm2/download_receipt.json
